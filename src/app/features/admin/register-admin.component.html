<div class="admin-register-page">
  <section class="panel admin-register-card">
    <header class="admin-register-header">
      <div class="badge">Admin Access</div>
      <h1>Register Admin</h1>
      <p class="muted">Create an admin account using the existing backend registration endpoint.</p>
    </header>

    <form class="stack" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" formControlName="fullName" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <div class="actions">
        <button class="button accent" type="submit" [disabled]="loading" [attr.aria-busy]="loading">
          {{ loading ? 'Creating...' : 'Create Admin' }}
        </button>
        <a class="button secondary" routerLink="/login">Back to login</a>
      </div>
    </form>
  </section>
</div>

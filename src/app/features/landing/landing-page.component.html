<main class="landing-page">
  <nav class="landing-nav" aria-label="Public navigation">
    <a class="brand" routerLink="/">
      <span class="brand-mark">F</span>
      <span class="brand-name">FlowBoard</span>
    </a>

    <div class="nav-actions">
      <a class="nav-link" routerLink="/login">Login</a>
      <a class="button accent signup-link" routerLink="/signup">Sign Up</a>
    </div>
  </nav>

  <section class="hero-section" aria-labelledby="landing-title">
    <div class="hero-content">
      <span class="hero-kicker">Simple project flow for modern teams</span>
      <h1 id="landing-title">Organize Work. Collaborate Better.</h1>
      <p>
        Manage workspaces, boards, tasks, teams and productivity in one place.
      </p>

      <div class="hero-actions">
        <button class="button accent primary-cta" type="button" (click)="getStarted()">
          Get Started
        </button>
        <a class="button secondary" routerLink="/signup">Learn More</a>
      </div>
    </div>

    <div class="hero-visual" aria-hidden="true">
      <div class="visual-window">
        <div class="visual-toolbar">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="visual-board">
          <div class="visual-column">
            <span class="column-title"></span>
            <span class="task-card wide"></span>
            <span class="task-card"></span>
            <span class="task-card short"></span>
          </div>
          <div class="visual-column">
            <span class="column-title"></span>
            <span class="task-card"></span>
            <span class="task-card wide"></span>
            <span class="task-card short blue"></span>
          </div>
          <div class="visual-column">
            <span class="column-title"></span>
            <span class="task-card wide"></span>
            <span class="task-card blue"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="features-section" aria-label="FlowBoard features">
    <article class="feature-card" *ngFor="let feature of features">
      <span class="feature-icon" [class]="'feature-icon ' + feature.icon">
        <svg *ngIf="feature.icon === 'workspace'" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Zm3 1v3h10v-3H7Zm0 5v6h4v-6H7Zm6 0v6h4v-6h-4Z" />
        </svg>
        <svg *ngIf="feature.icon === 'board'" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm1 4v8h3V8H6Zm5 0v8h3V8h-3Zm5 0v8h2V8h-2Z" />
        </svg>
        <svg *ngIf="feature.icon === 'team'" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 11a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7 1a3 3 0 1 1 0-6 3 3 0 0 1 0 6ZM2.5 19.5c.5-3.3 2.8-5.5 6-5.5s5.5 2.2 6 5.5a1 1 0 0 1-1 1.2h-10a1 1 0 0 1-1-1.2Zm12.9 1.2c.2-.5.2-1 .1-1.5a8.5 8.5 0 0 0-1.7-4 5.2 5.2 0 0 1 1.8-.3c2.7 0 4.7 1.8 5.2 4.6a1 1 0 0 1-1 1.2h-4.4Z" />
        </svg>
      </span>
      <h2>{{ feature.title }}</h2>
      <p>{{ feature.description }}</p>
    </article>
  </section>

  <footer class="landing-footer">
    <span>&copy; FlowBoard</span>
  </footer>
</main>

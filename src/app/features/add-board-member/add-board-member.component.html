<div class="dialog-overlay" (click)="close()">
  <section class="panel dialog-card" (click)="$event.stopPropagation()">
    <header class="dialog-header">
      <div>
        <div class="badge">Board Members</div>
        <h2>Add member</h2>
        <p class="muted">Provide the user id to add this member to board #{{ boardId }}.</p>
      </div>
      <button class="button secondary" type="button" (click)="close()">Close</button>
    </header>

    <form class="stack" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="boardMemberUserId">User ID</label>
        <input id="boardMemberUserId" type="number" formControlName="userId" placeholder="Enter user id" />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <div class="actions">
        <button class="button accent" type="submit" [disabled]="submitting || form.invalid">
          {{ submitting ? 'Adding...' : 'Add Member' }}
        </button>
      </div>
    </form>
  </section>
</div>
